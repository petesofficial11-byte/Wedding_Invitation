<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Dancing+Script:wght@600&family=Lato:wght@300;400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Ensure the background matches the invite on mobile */
  html, body {
    height: 100%;
    background: #e8e4d9; /* The color seen in your screenshot */
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .invite-shell {
    width: 100%;
    max-width: 420px; /* Limits width on Desktop */
    height: 100dvh;   /* Dynamic Viewport Height for mobile */
    max-height: 850px; /* Limits height on Desktop */
    margin: 0 auto;
    background: #faf8f3;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid #d4c9a0;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  /* ---- FULL SCREEN MOBILE OVERRIDE ---- */
  @media (max-width: 480px) {
    body { background: #faf8f3; }
    .invite-shell {
      max-width: 100%;
      max-height: 100dvh;
      border-radius: 0;
      border: none;
    }
  }

  /* ---- SCREENS ---- */
  .screen { 
    display: none; 
    flex-direction: column; 
    align-items: center; 
    flex: 1; /* Occupy remaining space above nav */
    position: relative; 
    overflow-y: auto; /* Allows scrolling if content is long */
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; }

  /* ---- COVER ---- */
  #s-cover {
    background: #f7f4ec;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    cursor: pointer;
  }
  
  /* ... (Rest of your existing CSS for text/buttons stays the same) ... */

  .cover-verse {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-style: italic;
    color: #6b7c3e;
    line-height: 1.7;
    margin-bottom: 28px;
    max-width: 280px;
  }
  .cover-verse span { display: block; font-style: normal; font-weight: 500; margin-top: 6px; font-size: 13px; }
  .monogram-wrap {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 1.5px solid #8a9e4a;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px;
    position: relative;
  }
  .monogram-inner {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    color: #6b7c3e;
    font-weight: 500;
    letter-spacing: -4px;
    line-height: 1;
  }
  .mono-leaf { position: absolute; font-size: 22px; color: #8a9e4a; }
  .mono-leaf.tl { top: 8px; left: 8px; transform: rotate(-30deg); }
  .mono-leaf.tr { top: 8px; right: 8px; transform: rotate(30deg); }
  .names-big {
    font-family: 'Dancing Script', cursive;
    font-size: 44px;
    color: #4a5e20;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .and-sym { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #8a9e4a; display: block; margin: 2px 0; }
  .cover-sub {
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #8a9e4a;
    margin-top: 10px;
    margin-bottom: 32px;
  }
  .swipe-hint {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    animation: bounce 1.8s infinite;
    color: #8a9e4a;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .swipe-arrow { font-size: 22px; line-height: 1; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  /* ---- BOTTOM NAV (Fixed at Bottom) ---- */
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); /* Extra padding for iPhones */
    border-top: 1px solid #d9d0a8;
    background: #f2eedf;
    flex-shrink: 0; /* Prevents nav from squishing */
  }
  .bnav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: #9a9a78; cursor: pointer; padding: 4px 8px; border-radius: 8px;
    transition: color 0.2s, background 0.2s; border: none; background: transparent; font-family: 'Lato', sans-serif;
  }
  .bnav-item.active { color: #4a5e20; }

  /* Transitions */
  .slide-in-right { animation: slideInRight 0.35s ease; }
  .slide-in-left { animation: slideInLeft 0.35s ease; }
  @keyframes slideInRight { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
  @keyframes slideInLeft { from { opacity:0; transform: translateX(-40px); } to { opacity:1; transform: translateX(0); } }
</style>
